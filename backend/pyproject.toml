[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anonymous-reader-backend"
version = "0.1.0"
description = "匿名版阅读器后端：X岛（NMB）数据抓取 → 入库 → 检索 → 阅读"
readme = "../README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
keywords = ["nmb", "xdnmb", "archiver", "fastapi", "full-text-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
# requirements.txt 是锁定版本，镜像与本地安装都用它；
# 这里的 dependencies 供 pip install -e . 解析，两者保持同步。
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "cryptography>=43",
    "zxing-cpp>=2.2",
    "pillow>=10",
    "python-docx>=1.1",
    "fpdf2>=2.7",
    "psycopg[binary]>=3.2",
    "pymysql>=1.1",
]

[project.urls]
Homepage = "https://github.com/K-02-b/nmb-reader"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py311"
# 这份是从 nmb-exporter vendored 过来的，保持与上游一致的写法，不按本项目风格改写
extend-exclude = ["app/services/nmb_export.py"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 的依赖注入就是在默认参数里调用 Depends/Query，属于框架用法而非可变默认值问题
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
# 脚本需要先改 sys.path 再 import app
"scripts/*" = ["E402"]
